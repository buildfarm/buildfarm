name: Pin maven_install.json

on:
  push:
    branches:
    - renovate/**
    paths:
    - MODULE.bazel

concurrency:
  group: pin-maven-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin:
    name: Pin Maven lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86   # 0.19.0
      with:
        bazelisk-cache: true

    - name: Pin Maven artifacts
      run: REPIN=1 bazel run @buildfarm_maven//:pin

    - name: Commit maven_install.json if changed
      run: |
        set -euo pipefail
        if git diff --quiet -- maven_install.json; then
          echo "maven_install.json unchanged"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add maven_install.json
        git commit -m "chore(deps): pin maven_install.json"
        git push origin "HEAD:${GITHUB_REF_NAME}"
